#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# androidx.lifecycle 2.11 requires compiling against 37, which is newer than what
# AGP 9.1.0 lists as recommended. The combination builds correctly.
android.suppressUnsupportedCompileSdk=37
# Kotlin/Native targets are declared but iOS tests cannot run on Linux.
kotlin.native.ignoreDisabledTargets=true

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # androidApp applies the Google Services Gradle plugin. The credential file is
      # intentionally untracked, so CI restores it from the repository secret.
      - name: Restore Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

      - name: Build client
        run: ./gradlew build

      - name: Test client
        run: ./gradlew allTests

      - name: Test backend
        working-directory: backend
        run: ./gradlew test
